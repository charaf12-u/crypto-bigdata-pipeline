<svg xmlns="http://www.w3.org/2000/svg" width="700" height="175" viewBox="0 0 700 175">
  <rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <rect width="100%" height="30" rx="8" fill="#161b22" />
  <rect y="20" width="100%" height="10" fill="#161b22" />
  <line x1="0" y1="30" x2="700" y2="30" stroke="#30363d" stroke-width="1" />
  
  <circle cx="20" cy="15" r="6" fill="#ff5f56" />
  <circle cx="40" cy="15" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="15" r="6" fill="#27c93f" />
  
  <text x="350" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">bash - Airflow Standalone</text>
  
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">
    <text x="25" y="60" fill="#8b949e"># Export Airflow paths</text>
    <text x="25" y="80">(venv) <tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~/crypto-bigdata-pipeline</tspan>$ export AIRFLOW_HOME=~/airflow</text>
    <text x="25" y="100">(venv) <tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~/crypto-bigdata-pipeline</tspan>$ export PYTHONPATH=$(pwd)</text>
    
    <text x="25" y="130" fill="#8b949e"># Start Airflow standalone server</text>
    <text x="25" y="150">(venv) <tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~/crypto-bigdata-pipeline</tspan>$ airflow standalone</text>
  </g>
</svg>
