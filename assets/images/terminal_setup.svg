<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
  <rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <rect width="100%" height="30" rx="8" fill="#161b22" />
  <rect y="20" width="100%" height="10" fill="#161b22" />
  <line x1="0" y1="30" x2="700" y2="30" stroke="#30363d" stroke-width="1" />
  
  <circle cx="20" cy="15" r="6" fill="#ff5f56" />
  <circle cx="40" cy="15" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="15" r="6" fill="#27c93f" />
  
  <text x="350" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">bash - Setup Environment</text>
  
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">
    <text x="25" y="60" fill="#8b949e"># Clone the repository and navigate to directory</text>
    <text x="25" y="80"><tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~</tspan>$ git clone https://github.com/your-username/crypto-bigdata-pipeline.git</text>
    <text x="25" y="100"><tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~</tspan>$ cd crypto-bigdata-pipeline</text>
    
    <text x="25" y="135" fill="#8b949e"># Create a virtual environment</text>
    <text x="25" y="155"><tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~/crypto-bigdata-pipeline</tspan>$ python -m venv venv</text>
    
    <text x="25" y="190" fill="#8b949e"># Activate the virtual environment (Windows/CMD)</text>
    <text x="25" y="210"><tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~/crypto-bigdata-pipeline</tspan>$ .\venv\Scripts\activate</text>
    
    <text x="25" y="245" fill="#8b949e"># Activate the virtual environment (Linux/macOS)</text>
    <text x="25" y="265"><tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~/crypto-bigdata-pipeline</tspan>$ source venv/bin/activate</text>
    
    <text x="25" y="300" fill="#8b949e"># Install pipeline dependencies</text>
    <text x="25" y="320">(venv) <tspan fill="#58a6ff">user@cryptopulse</tspan>:<tspan fill="#ff7b72">~/crypto-bigdata-pipeline</tspan>$ pip install -r requirements.txt</text>
  </g>
</svg>
